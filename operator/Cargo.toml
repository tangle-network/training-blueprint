[package]
name = "distributed-training"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "distributed_training"
path = "src/lib.rs"

[[bin]]
name = "training-operator"
path = "src/main.rs"

[[bin]]
name = "training-operator-http"
path = "src/bin/http-only.rs"

[dependencies]
blueprint-sdk = { workspace = true, features = ["tee"] }
blueprint-networking = { workspace = true }

tangle-inference-core = { git = "https://github.com/tangle-network/tangle-inference-core", rev = "c7e11063a2ba30c662c64356a73bd81d4a03a267", default-features = false, features = ["billing", "http", "metrics"] }
alloy = { workspace = true }
alloy-sol-types = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true }
ndarray = { workspace = true }
sha2 = { workspace = true }
prometheus = { workspace = true }

# Web framework
axum = { version = "0.7", features = ["json", "macros"] }
tower-http = { version = "0.5", features = ["cors", "limit", "trace", "timeout"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Misc
uuid = { version = "1", features = ["v4"] }
blueprint-crypto = { workspace = true }
libp2p = { version = "0.54", features = ["identify"] }
crossbeam-channel = "0.5"
rand = "0.8"
blueprint-webhooks = { git = "https://github.com/tangle-network/blueprint", rev = "a380ec1e6320a8e949a13410873154a4c1e2ff46", package = "blueprint-webhooks", features = ["notifier"] }
tokio-stream = "0.1"
futures = "0.3"

[dev-dependencies]
blueprint-sdk = { git = "https://github.com/tangle-network/blueprint", rev = "a380ec1e6320a8e949a13410873154a4c1e2ff46", package = "blueprint-sdk", features = ["testing", "tangle"] }
blueprint-networking = { git = "https://github.com/tangle-network/blueprint", rev = "a380ec1e6320a8e949a13410873154a4c1e2ff46", package = "blueprint-networking" }
blueprint-crypto = { git = "https://github.com/tangle-network/blueprint", rev = "a380ec1e6320a8e949a13410873154a4c1e2ff46", package = "blueprint-crypto" }
blueprint-anvil-testing-utils = { git = "https://github.com/tangle-network/blueprint", rev = "a380ec1e6320a8e949a13410873154a4c1e2ff46", package = "blueprint-anvil-testing-utils" }
alloy-primitives = "1"
alloy-sol-types = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
serde_json = "1"
